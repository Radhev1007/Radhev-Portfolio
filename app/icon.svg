<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#000000"/>
  <!-- Geometric lowercase r, the foot of the stem carrying the accent. The
       shoulder starts inside the stem (x=36, not at its edge) so the join
       cannot anti-alias into a hairline seam, and it terminates square rather
       than tapering, which kept an earlier attempt reading as a bracket. -->
  <g fill="#FFFFFF">
    <rect x="26" y="24" width="17" height="56"/>
    <path d="M36 24h12a28 28 0 0 1 28 28H59a11 11 0 0 0-11-11H36z"/>
  </g>
  <rect x="26" y="68" width="17" height="12" fill="#F43C00"/>
</svg>
