<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#141414"/>
  <!-- Geometric R: straight bar, true circle for the bowl, diagonal leg.
       The whole letterform is one colour so it reads as a single shape —
       colouring the leg instead made it parse as a P with a slash — and the
       accent lives in the counter. Joins overlap to avoid hairline seams. -->
  <g fill="#F2EFE6">
    <rect x="18" y="14" width="17" height="72"/>
    <circle cx="48" cy="34" r="20"/>
    <path d="M40 48h19l23 38H63z"/>
  </g>
  <circle cx="48" cy="34" r="8.5" fill="#F43C00"/>
</svg>
